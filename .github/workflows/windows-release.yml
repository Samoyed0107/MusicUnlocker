name: Windows Release Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to check out (for example v0.7.0); leave empty for an artifact-only build of the default branch"
        required: false
        type: string
      create_draft_release:
        description: "Create or update a Draft GitHub Release; requires an existing matching tag"
        required: true
        default: false
        type: boolean
      generate_attestations:
        description: "Generate GitHub provenance attestations when the repository/account supports them"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag != '' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-release-candidate:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      name: ${{ steps.context.outputs.name }}
      version: ${{ steps.context.outputs.version }}
      tag: ${{ steps.context.outputs.tag }}
      release_note: ${{ steps.context.outputs.release_note }}
      artifact_name: ${{ steps.context.outputs.artifact_name }}

    steps:
      - name: Check out source or existing tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go 1.26.5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: false

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Install exact release toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --global npm@11.16.0
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          choco install nsis --version=3.12.0 --yes --no-progress
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) { throw "NSIS 3.12 makensis was not installed" }
          (Split-Path -Parent $makensis) | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8

      - name: Record and verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          go version
          node --version
          npm --version
          wails version
          makensis /VERSION
          if ((go env GOVERSION) -ne "go1.26.5") { throw "Unexpected Go version" }
          if ((node --version) -ne "v24.18.0") { throw "Unexpected Node.js version" }
          if ((npm --version) -ne "11.16.0") { throw "Unexpected npm version" }
          if ((wails version) -notmatch "v2\.15\.0") { throw "Unexpected Wails version" }
          if ((makensis /VERSION) -notmatch "v3\.12") { throw "Unexpected NSIS version" }

      - name: Validate invocation and release identity
        id: context
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CREATE_DRAFT: ${{ inputs.create_draft_release }}
        run: |
          if ($env:CREATE_DRAFT -eq "true" -and -not $env:RELEASE_TAG) {
            throw "Draft Release creation requires an existing tag input"
          }
          ./scripts/verify-windows-release.ps1 -Tag $env:RELEASE_TAG -GitHubOutput $env:GITHUB_OUTPUT

      - name: Install locked frontend dependencies
        shell: pwsh
        run: npm --prefix frontend ci

      - name: Build authoritative Windows release directory
        shell: pwsh
        run: ./scripts/build-windows-release.ps1

      - name: Verify six-file allowlist and SHA256SUMS
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/verify-windows-release.ps1 -ArtifactDirectory artifacts -Tag $env:RELEASE_TAG

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.context.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Attest application artifacts
        if: ${{ inputs.generate_attestations }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/${{ steps.context.outputs.name }}-Setup-${{ steps.context.outputs.version }}-win64.exe
            artifacts/${{ steps.context.outputs.name }}-${{ steps.context.outputs.version }}-win64.exe
            artifacts/${{ steps.context.outputs.name }}-${{ steps.context.outputs.version }}-win64-portable.zip

  draft-release:
    if: ${{ inputs.create_draft_release }}
    needs: build-release-candidate
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out the verified existing tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go 1.26.5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: false

      - name: Download verified workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-release-candidate.outputs.artifact_name }}
          path: artifacts/

      - name: Reverify and create or update Draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTE: ${{ needs.build-release-candidate.outputs.release_note }}
        run: ./scripts/publish-draft-windows-release.ps1 -Tag $env:RELEASE_TAG -ArtifactDirectory artifacts -ReleaseNote $env:RELEASE_NOTE
